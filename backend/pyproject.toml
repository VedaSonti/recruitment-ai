[project]
name = "recruitment-ai-backend"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "fastapi",
    "uvicorn",
    "motor",
    "pymongo",
    "python-multipart",
    "openai",
    "python-dotenv",
    "numpy",
    "python-docx",
    "pypdf",
    "Pillow",
    "opencv-contrib-python-headless==5.0.0.93 ; sys_platform == 'linux'",
    "opencv-contrib-python==5.0.0.93 ; sys_platform != 'linux'",
    "mediapipe==1.0.0",
    "imageio-ffmpeg==0.6.0",
    "torch==2.11.0+cpu",
    "torchaudio==2.11.0+cpu",
    "torchcodec==0.16.0+cpu",
    "pyannote.audio==4.0.7",
    "reportlab",
    "argon2-cffi",
    "PyJWT",
    "email-validator",
    "weaviate-client==4.22.0",
    "vercel>=0.5.0,<1",
]

[tool.uv]
environments = [
    "sys_platform == 'linux' and python_full_version == '3.12.*'",
]
override-dependencies = [
    "opencv-contrib-python==5.0.0.93 ; sys_platform != 'linux'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchcodec = { index = "pytorch-cpu" }
